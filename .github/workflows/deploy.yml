name: Deploy al servidor (FTP)

# Sube el sitio por FTP en cada push a main, directo a producción
# (public_html/). El WordPress antiguo quedó en wordpress_respaldo/.
#
# Requiere estos secrets en GitHub (Settings → Secrets and variables → Actions):
#   FTP_SERVER    ej: ftp.jesusteespera.cl
#   FTP_USERNAME  usuario del hosting
#   FTP_PASSWORD  contraseña del hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            README.md
